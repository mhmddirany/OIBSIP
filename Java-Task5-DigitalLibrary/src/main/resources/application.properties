spring.application.name=digital-library
server.port=8080

# H2 file database: data is stored in ./data and survives restarts. No install needed.
spring.datasource.url=jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Session cookie hardening (the API uses session-based login)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Library rules
library.loan-days=14
library.fine-per-day=5
library.max-active-loans=3
